<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZX Spectrum Database</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4F1EA; /* Color crema suave */
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Sombras sólidas Neo-brutalistas */
        .brutal-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        .brutal-shadow-sm {
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
        }
        
        /* Efecto click en botones */
        .brutal-btn {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        }

        /* Colores sutiles ZX Spectrum */
        .zx-red { background-color: #D9534F; }
        .zx-yellow { background-color: #F0AD4E; }
        .zx-green { background-color: #5CB85C; }
        .zx-blue { background-color: #5BC0DE; }

        /* Scrollbar Neo-brutalista */
        .custom-scrollbar::-webkit-scrollbar {
            width: 12px;
            border-left: 2px solid black;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #F4F1EA;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #000;
            border: 2px solid #F4F1EA;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-4 md:p-6 gap-4 text-black box-border max-w-7xl mx-auto">

    <!-- Cabecera -->
    <header class="flex-none bg-white border-2 border-black brutal-shadow p-3 flex justify-between items-center relative overflow-hidden">
        <!-- Detalle sutil ZX Spectrum en la parte superior del borde -->
        <div class="absolute top-0 left-0 w-full h-1.5 flex">
            <div class="w-1/4 h-full zx-red"></div>
            <div class="w-1/4 h-full zx-yellow"></div>
            <div class="w-1/4 h-full zx-green"></div>
            <div class="w-1/4 h-full zx-blue"></div>
        </div>

        <div class="flex items-center gap-3 mt-1">
            <div class="bg-black text-white font-bold px-2 py-1 text-sm border-2 border-black">
                ZX
            </div>
            <h1 class="text-lg font-bold uppercase tracking-tight">Spectrum Data Wrapper</h1>
        </div>

        <!-- Indicador de registros (Color Terracota Suave): se consulta a la aplicación legada cada vez -->
        <div class="bg-[#E29578] border-2 border-black brutal-shadow-sm px-4 py-1.5 flex items-center gap-3 mt-1">
            <span class="text-xs font-bold uppercase">Registros:</span>
            <span id="count" class="text-base font-mono font-bold bg-white px-2 py-0.5 border-2 border-black min-w-[3.5rem] text-center">…</span>
            <button type="button" id="refresh-btn" title="Volver a preguntar a la aplicación legada"
                    class="brutal-btn bg-white border-2 border-black text-sm font-bold px-2 py-0.5 brutal-shadow-sm">&#8635;</button>
        </div>
    </header>

    <!-- Formularios de Búsqueda -->
    <div class="flex-none grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Buscar por Nombre (Color Azul/Teal apagado) -->
        <form id="name-form" class="bg-[#A3C4BC] border-2 border-black brutal-shadow p-3 flex flex-col gap-2">
            <label for="name-input" class="text-xs font-bold uppercase">Buscar por Nombre</label>
            <div class="flex gap-2">
                <input type="text" id="name-input" autocomplete="off" minlength="3" maxlength="40" class="flex-1 bg-white border-2 border-black text-sm px-2 py-1.5 outline-none focus:bg-[#f8f9fa] font-mono" placeholder="Ej: FEUD (mín. 3 caracteres)">
                <button type="submit" class="brutal-btn bg-white border-2 border-black text-sm font-bold px-4 py-1.5 brutal-shadow-sm uppercase disabled:opacity-50">
                    Buscar
                </button>
            </div>
        </form>

        <!-- Buscar por Cinta (Color Mostaza suave) -->
        <form id="tape-form" class="bg-[#E0A96D] border-2 border-black brutal-shadow p-3 flex flex-col gap-2">
            <label for="tape-input" class="text-xs font-bold uppercase">Buscar por Cinta</label>
            <div class="flex gap-2">
                <input type="text" id="tape-input" autocomplete="off" maxlength="3" class="flex-1 bg-white border-2 border-black text-sm px-2 py-1.5 outline-none focus:bg-[#f8f9fa] font-mono uppercase" placeholder="Ej: A, 45, F">
                <button type="submit" class="brutal-btn bg-white border-2 border-black text-sm font-bold px-4 py-1.5 brutal-shadow-sm uppercase disabled:opacity-50">
                    Buscar
                </button>
            </div>
        </form>

    </div>

    <!-- Área de Resultados -->
    <div class="flex-1 flex flex-col bg-white border-2 border-black brutal-shadow overflow-hidden relative min-h-0">

        <!-- Capa de Carga -->
        <div id="loading-overlay" class="absolute inset-0 bg-[#F4F1EA]/90 z-20 hidden flex-col items-center justify-center gap-3 border-b-2 border-black">
            <div class="font-mono text-sm font-bold bg-black text-white px-4 py-2 uppercase animate-pulse border-2 border-black">
                [ RPA &amp; OCR Ejecutándose... ]
            </div>
            <div id="loading-text" class="font-mono text-xs font-bold text-center px-4"></div>
            <div class="font-mono text-xs text-center px-4">No toques el teclado ni el ratón: el robot está escribiendo en DOSBox.</div>
        </div>

        <!-- Cabecera de la Tabla -->
        <div class="bg-black text-white flex-none pr-[12px]"> <!-- Padding right compensa el scrollbar grueso -->
            <table class="w-full table-fixed text-left text-xs uppercase font-bold">
                <thead>
                    <tr>
                        <th class="py-2 px-3 border-r-2 border-white w-28 text-center">Nº Registro</th>
                        <th class="py-2 px-3 border-r-2 border-white">Nombre del Programa</th>
                        <th class="py-2 px-3 border-r-2 border-white w-40">Tipo</th>
                        <th class="py-2 px-3 w-20 text-center">Cinta</th>
                    </tr>
                </thead>
            </table>
        </div>

        <!-- Cuerpo de la Tabla (Scrollable) -->
        <div class="flex-1 overflow-y-auto custom-scrollbar" style="scrollbar-gutter: stable"> <!-- hueco de la barra siempre reservado: así cuadra con la cabecera -->
            <table class="w-full table-fixed text-left text-sm font-mono">
                <tbody id="results-data"></tbody>
            </table>
            <p id="results-msg" class="p-6 text-center text-sm font-bold font-mono">
                Busca un programa por nombre o lista una cinta.
            </p>
        </div>

        <!-- Pie de tabla (Status) -->
        <div class="bg-[#F4F1EA] border-t-2 border-black p-2 flex-none flex justify-between items-center text-xs font-bold uppercase">
            <span id="status-left">Esperando consulta</span>
            <span id="status-right">—</span>
        </div>
    </div>

    <!-- Script -->
    <script>
        const $ = (id) => document.getElementById(id);
        let busy = false;

        function setBusy(on, text) {
            busy = on;
            const overlay = $('loading-overlay');
            overlay.classList.toggle('hidden', !on);
            overlay.classList.toggle('flex', on);
            $('loading-text').textContent = text || '';
            document.querySelectorAll('form button, #refresh-btn').forEach((b) => (b.disabled = on));
        }

        function status(left, right, isError) {
            $('status-left').textContent = left;
            $('status-right').textContent = right;
            $('status-right').style.color = isError ? '#b91c1c' : '';
        }

        // Pregunta al servidor, que a su vez teclea en la aplicación legada y lee su pantalla.
        async function call(url) {
            const res = await fetch(url);
            let data = {};
            try { data = await res.json(); } catch (e) { /* respuesta sin JSON */ }
            if (!res.ok) throw new Error(data.error || 'Error HTTP ' + res.status);
            return data;
        }

        async function refreshCount() {
            const el = $('count');
            el.textContent = '…';
            try {
                el.textContent = (await call('/api/registros')).registros;
                return true;
            } catch (e) {
                el.textContent = '?';
                el.title = e.message;
                return false;
            }
        }

        function showRows(rows) {
            const tbody = $('results-data');
            tbody.replaceChildren();
            rows.forEach((r, i) => {
                const tr = document.createElement('tr');
                // La aplicación busca por subcadena: se resaltan los programas cuyo nombre es exactamente el buscado.
                let rowColor = i % 2 ? ' bg-white' : '';
                if (r.exacto) rowColor = ' bg-[#A3C4BC] font-bold';
                tr.className = 'border-b-2 border-black hover:bg-[#F4F1EA] transition-colors' + rowColor;
                if (r.exacto) tr.title = 'Coincide exactamente con el nombre buscado';
                // Nº y REGISTRO de la aplicación coinciden (orden por antigüedad): se muestra una sola columna.
                const cells = [
                    [r.registro, 'w-28 text-center font-bold'],
                    [r.nombre, ''],
                    [r.tipo, 'w-40 text-xs'],
                    [r.cinta, 'w-20 text-center font-bold'],
                ];
                cells.forEach(([text, cls], c) => {
                    const td = document.createElement('td');
                    td.className = 'py-2 px-3 ' + (c < cells.length - 1 ? 'border-r-2 border-black ' : '') + cls;
                    td.textContent = text;   // textContent: nunca se interpreta como HTML
                    if (c === 1 && r.exacto) {
                        const badge = document.createElement('span');
                        badge.className = 'ml-2 px-1 border-2 border-black bg-white text-[10px] align-middle';
                        badge.textContent = 'EXACTO';
                        td.appendChild(badge);
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function showMessage(text, isError) {
            $('results-data').replaceChildren();
            const p = $('results-msg');
            p.textContent = text;
            p.style.color = isError ? '#b91c1c' : '';
            p.classList.remove('hidden');
        }

        async function run(label, url, loadingText, onData) {
            if (busy) return;
            const t0 = performance.now();
            setBusy(true, loadingText);
            try {
                const data = await call(url);
                const rows = data.resultados || [];
                $('results-msg').classList.add('hidden');
                if (rows.length) showRows(rows); else showMessage(onData.empty, false);
                const secs = ((performance.now() - t0) / 1000).toFixed(1).replace('.', ',');
                let summary = label + ': ' + rows.length + ' resultado' + (rows.length === 1 ? '' : 's');
                if (rows.length && 'exacto' in rows[0]) {
                    const exact = rows.filter((r) => r.exacto).length;
                    summary += ' (' + exact + ' exacto' + (exact === 1 ? '' : 's') + ')';
                }
                status(summary, 'OK · ' + secs + ' s', false);
            } catch (e) {
                showMessage('No se pudo consultar la aplicación legada: ' + e.message, true);
                status(label, 'ERROR', true);
            } finally {
                setBusy(false);
            }
            refreshCount();   // el contador se vuelve a pedir a la aplicación legada tras cada operación
        }

        $('name-form').addEventListener('submit', (ev) => {
            ev.preventDefault();
            // Sin pasar a mayúsculas: la aplicación legada distingue mayúsculas ("FRIDAY 13th").
            const name = $('name-input').value.trim();
            if (!name) return;
            if (name.length < 3) {
                showMessage('Escribe al menos 3 caracteres: la aplicación busca el texto en cualquier parte del nombre.', true);
                return;
            }
            if (!/^[A-Za-z0-9 \-'.!&]+$/.test(name)) {
                showMessage('El nombre solo puede llevar letras sin acentos, números, espacios y los signos - \' . ! &', true);
                return;
            }
            run('Programa «' + name + '»', '/api/programa?nombre=' + encodeURIComponent(name),
                'Buscando «' + name + '» en la base de datos (con varios resultados puede tardar un rato)…',
                { empty: 'No hay ningún programa que contenga «' + name + '». Ojo: distingue mayúsculas.' });
        });

        $('tape-form').addEventListener('submit', (ev) => {
            ev.preventDefault();
            const id = $('tape-input').value.trim().toUpperCase();
            if (!id) return;
            if (!/^[A-Z0-9]{1,3}$/.test(id)) {
                showMessage('La cinta es una letra (A-Z) o un número (0-n).', true);
                return;
            }
            run('Cinta ' + id, '/api/cinta?id=' + encodeURIComponent(id),
                'Recorriendo el listado completo para la cinta ' + id + ' (unos 25 segundos)…',
                { empty: 'Ningún programa está grabado en la cinta ' + id + '.' });
        });

        $('refresh-btn').addEventListener('click', refreshCount);
        refreshCount();   // al cargar la página

        // Enlaces directos: /?nombre=FEUD  o  /?cinta=25  lanzan la búsqueda al abrir la página.
        const params = new URLSearchParams(location.search);
        if (params.get('nombre')) {
            $('name-input').value = params.get('nombre');
            $('name-form').requestSubmit();
        } else if (params.get('cinta')) {
            $('tape-input').value = params.get('cinta');
            $('tape-form').requestSubmit();
        }
    </script>
</body>
</html>
