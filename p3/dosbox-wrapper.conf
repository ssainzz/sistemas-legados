# Configuracion de DOSBox 0.74 para el wrapper (la usa arrancar.bat con -conf).
#
# Sin -conf, DOSBox usa la de %LOCALAPPDATA%\DOSBox\dosbox-0.74.conf, que es distinta en cada PC. El wrapper necesita
# siempre la misma ventana: el lector por plantillas exige un area cliente de exactamente 640x400 (80x25 celdas de
# 8x16 pixeles). Los valores son los que DOSBox genera por defecto, que son con los que se construyo el lector; aqui
# se fijan para que no dependan del PC. Lo que no aparece toma el valor por defecto de DOSBox.
# No se toca nada de Database-MSDOS: este fichero esta fuera de esa carpeta.

[sdl]
# Ventana (no pantalla completa) al tamano original de la imagen: 640x400 en el modo de texto de GW-BASIC.
fullscreen=false
windowresolution=original
output=surface
# Las teclas llegan a DOS como codigos de exploracion (KeyboardDriver los envia asi para los signos).
usescancodes=true
autolock=true
waitonerror=true
priority=higher,normal

[dosbox]
machine=svga_s3
memsize=16

[render]
frameskip=0
aspect=false
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=auto

[dos]
# La misma distribucion de teclado que Windows: el robot elige la tecla de cada signo segun la de Windows.
keyboardlayout=auto

[autoexec]
