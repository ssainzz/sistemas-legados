# Configuración de DOSBox 0.74 para el wrapper (arrancar.bat la pasa con -conf).
#
# Sin ella DOSBox usaría la configuración del usuario, distinta en cada PC. El lector necesita un área cliente de
# 640x400 (80x25 celdas de 8x16 píxeles): se fijan los valores por defecto de DOSBox, con los que se construyó.
# Está fuera de Database-MSDOS para no tocar esa carpeta.

[sdl]
# Ventana al tamaño original: 640x400 en el modo texto de GW-BASIC.
fullscreen=false
windowresolution=original
output=surface
# Las teclas llegan como códigos de exploración (así envía KeyboardDriver los signos).
usescancodes=true
autolock=true
waitonerror=true
priority=higher,normal

[dosbox]
machine=svga_s3
memsize=16

[render]
frameskip=0
aspect=false
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=auto

[dos]
# La misma distribución de teclado que Windows, con la que el robot elige la tecla de cada signo.
keyboardlayout=auto

[autoexec]
