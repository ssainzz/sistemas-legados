# Configuración del wrapper (los valores por defecto están en Config.java)

# --- Ventana de DOSBox ---
# Título de la ventana de DOSBox (se ignora "DOSBox Status Window").
window.title.prefix=DOSBox 0.74
# Zona de captura. Con width/height a 0 se usa el área cliente de DOSBox.
capture.x=0
capture.y=0
capture.width=0
capture.height=0

# --- Teclado y esperas (ms) ---
key.delay.ms=60
poll.interval.ms=150
# Espera máxima a que la pantalla cambie tras una tecla
change.timeout.ms=4000
# Espera máxima a que la pantalla se estabilice (dos capturas iguales)
stable.timeout.ms=5000

# --- OCR ---
# glyph     = lector por plantillas (exacto)
# tesseract = Tesseract. Con spa (el de la asignatura) comete errores; con dos (entrenado) lee los 763 registros
#             sin errores. Para usarlo: ocr.engine=tesseract, ocr.language=dos y ocr.preprocess=rejilla
ocr.engine=glyph
# Carpeta de spa.traineddata y dos.traineddata
tessdata.path=tessdata
# spa = el de la asignatura, dos = el entrenado
ocr.language=spa
# clasico = escala con suavizado, ocr.binarize y ocr.invert (para spa)
# rejilla = escala sin suavizar y ocr.column.gap píxeles entre columnas (para dos)
ocr.preprocess=clasico
ocr.column.gap=4
ocr.scale=2
# 0 = sin binarizar, 1..255 = umbral
ocr.binarize=0
# true = texto negro sobre blanco
ocr.invert=false

# --- Servidor web ---
server.port=8090
web.root=web

# --- Depuración: guarda cada captura en debug/ ---
debug.save=false
debug.dir=debug
