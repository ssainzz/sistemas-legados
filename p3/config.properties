# Configuracion del wrapper (todos los valores tienen un valor por defecto en Config.java)

# --- Ventana de DOSBox ---
# Se busca la ventana visible cuyo titulo empiece por este texto (se ignora "DOSBox Status Window").
window.title.prefix=DOSBox 0.74
# Zona de captura en pantalla. Si width/height son 0 se usa el area cliente de la ventana de DOSBox.
capture.x=0
capture.y=0
capture.width=0
capture.height=0

# --- Teclado / sincronizacion (ms) ---
key.delay.ms=60
poll.interval.ms=150
# Maximo que se espera a que la pantalla CAMBIE tras una accion
change.timeout.ms=4000
# Maximo que se espera a que la pantalla se ESTABILICE (dos capturas iguales seguidas)
stable.timeout.ms=5000

# --- OCR ---
# Carpeta que contiene spa.traineddata ("." = carpeta del proyecto, donde ya esta el fichero)
tessdata.path=.
ocr.language=spa
ocr.scale=2
# 0 = sin binarizar; 1..255 = umbral de binarizacion
ocr.binarize=0
# true si el OCR funciona mejor con texto negro sobre fondo blanco
ocr.invert=false

# --- Servidor web ---
server.port=8090
web.root=.

# --- Depuracion: guarda cada captura en debug/ ---
debug.save=false
debug.dir=debug
